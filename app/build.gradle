plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
    id "io.freefair.lombok" version "8.6"
    id 'io.freefair.aspectj.post-compile-weaving' version '8.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

group 'nhlgameupdatelambda'
version '1.0-SNAPSHOT'

dependencies {
    // This dependency is used by the application.
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.1' // ToDo upgrade to SDK 2.x
    implementation 'com.amazonaws:aws-lambda-java-log4j2:[1.6.0,)'
    implementation 'software.amazon.awssdk:dynamodb:2.21.20'
    implementation 'software.amazon.awssdk:dynamodb-enhanced:2.21.20'
    implementation 'software.amazon.awssdk:sns:2.25.26'

    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.4'

    aspect 'software.amazon.lambda:powertools-logging:1.18.0'
    aspect 'software.amazon.lambda:powertools-tracing:1.18.0'
    aspect 'software.amazon.lambda:powertools-metrics:1.18.0'
    implementation 'org.aspectj:aspectjrt:1.9.21.2'

    implementation 'com.google.dagger:dagger:2.50'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.50'

    runtimeOnly 'com.amazonaws:aws-lambda-java-log4j2:1.5.1'

    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.+'
}

task copyRuntimeDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/dependency'
}

build.dependsOn copyRuntimeDependencies

jar {
    manifest {
        attributes 'Main-Class': 'nhlgameupdatelambda.NhlGameUpdateLambda'
    }
}
